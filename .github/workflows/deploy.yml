name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Supabase SQL Migration
        if: hashFiles('sql/migration-add-columns.sql') != ''
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "⚠️  SUPABASE_DATABASE_URL secret not set — skipping migration"
            exit 0
          fi
          echo "=== Installing PostgreSQL client ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          echo "=== Running SQL migration ==="
          psql "$SUPABASE_DATABASE_URL" -f sql/migration-add-columns.sql
          echo "✅ Migration complete"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "=== Pulling latest changes ==="
            cd ${{ secrets.DEPLOY_PATH }}
            git stash --include-untracked || true
            git pull origin main
            sudo systemctl reload nginx || echo "nginx reload skipped (not running or not installed)"
            echo "=== Deploy complete ==="

      - name: Health Check
        run: |
          echo "=== Waiting for nginx to reload ==="
          sleep 5
          echo "=== Checking site health ==="
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 https://codebridgecademy.com/)
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check failed — site returned HTTP $STATUS"
            exit 1
          fi
          echo "✅ Health check passed — site is responding with HTTP 200"
